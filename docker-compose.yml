services:
  vllm:
    image: ${VLLM_IMAGE:-ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest}
    pull_policy: if_not_present
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"

      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"

      # EDIT THESE TWO LINES
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"

      NCCL_IB_GID_INDEX: "3"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"

      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"

    command:
      - bash
      - -lc
      - >
        exec vllm serve unsloth/Qwen3.8-27B-NVFP4
        --served-model-name vlm
        --host 0.0.0.0
        --port ${VLLM_PORT:-8000}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype fp8
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-262144}
        --max-num-seqs 4
        --max-num-batched-tokens 8192
        --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION:-0.2}"
        --enable-prefix-caching
        --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
        --distributed-executor-backend mp
        --tool-call-parser qwen3_coder
        --enable-auto-tool-choice
        --reasoning-parser qwen3
        --mm-encoder-tp-mode data
        --default-chat-template-kwargs.thinking=true
        --default-chat-template-kwargs.reasoning_effort=xhigh
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
